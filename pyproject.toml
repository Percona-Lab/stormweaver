[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "stormweaver"
dynamic = ["version"]
description = "Concurrent database testing tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"

[project.scripts]
stormweaver = "stormweaver.cli:main"

[project.entry-points.pytest11]
stormweaver = "stormweaver.pytest_plugin"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.22"
wheel.packages = ["python/stormweaver"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>[0-9][^\\s]*)"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.14",
    "ruff>=0.9",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["python/stormweaver"]

[[tool.mypy.overrides]]
module = "stormweaver._stormweaver"
ignore_missing_imports = true

[tool.cibuildwheel]
# cibuildwheel 4.x builds cp314t by default (the old cpython-freethreading
# enable flag was removed in 4.0, using it now is a schema error) - the
# build selector below is what actually restricts us to just this one target.
build = ["cp314t-manylinux_x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
build-frontend = "build[uv]"
test-command = "python -c 'import stormweaver; print(stormweaver.__version__)'"

[tool.cibuildwheel.linux]
# manylinux_2_28 is AlmaLinux 8: libpq from AppStream, cryptopp from EPEL.
# auditwheel bundles libpq/libmariadb/libcryptopp into the wheel.
before-all = """
set -e
dnf install -y epel-release
dnf install -y libpq-devel mariadb-connector-c-devel cryptopp-devel
"""
