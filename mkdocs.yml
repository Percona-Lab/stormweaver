site_name: StormWeaver Documentation
theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
exclude_docs: |
  superpowers/**
nav:
  - Getting started: index.md
  - Building from source: building.md
  - Writing scenarios: writing-scenarios.md
  - Python actions: python-actions.md
  - Transactions: transactions.md
  - Variable fuzzing: variable-fuzzing.md
  - Stable tests: stable-tests.md
  - Determinism: determinism.md
  - Server wrappers: wrappers.md
  - Randomized testing concepts: randomized-testing-concepts.md
  - Config parameters: config-parameters.md
  - Design notes:
      - Enhanced statistics ADR: adr-enhanced-statistics.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
